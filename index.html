<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>SuperDepth for Windows (WASM) — 移植中</title>
<style>
  html, body {
    margin: 0; min-height: 100%;
    background: #0d1116; color: #c8d0d8;
    font: 13px/1.6 system-ui, sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    padding: 12px 0;
  }
  canvas {
    /* Software rasterised at 640x480 and scaled by the browser with nearest
       neighbour, so the 1999 pixels stay pixels.  No WebGL anywhere. */
    image-rendering: pixelated;
    width: 1280px; height: 960px;
    max-width: 100vw; max-height: 72vh;
    background: #000;
    border: 1px solid #2a3239;
  }
  .keys { opacity: .75; text-align: center; }
  kbd {
    background: #1c2329; border: 1px solid #2f3942; border-radius: 3px;
    padding: 0 4px; font-family: inherit;
  }
  #status { min-height: 1.6em; opacity: .8; }
  #diag { opacity: .45; font-size: 11px; font-family: ui-monospace, monospace; }
  a { color: #7ab7d8; }
</style>
</head>
<body>
<canvas id="screen" width="640" height="480"></canvas>
<div class="keys">
  <kbd>1</kbd> 文字とスプライト &nbsp; <kbd>2</kbd> パターン一覧 &nbsp;
  <kbd>F4</kbd> BGM &nbsp; <kbd>&larr;</kbd> <kbd>&rarr;</kbd> 曲を選ぶ
</div>
<div id="status">読み込み中…</div>
<div id="diag"></div>
<div class="keys" style="max-width:60em">
  <b>まだ移植中です。</b>ここに出ているのは原作から取り出した絵と音
  —— <code>.dar</code> の書庫、256 色パレット、原作のフォント（8x8 と
  16x16 の 8 色）、スプライト、そして原作の MIDI を自前で合成した BGM。
  ゲーム本体はまだです。
  <a href="https://github.com/yomei-o/super_depth_win_wasm">ソースと解析メモ</a>
</div>

<script>
const cv = document.getElementById('screen');
const ctx2d = cv.getContext('2d', { alpha: false });
const statusEl = document.getElementById('status');
const diagEl = document.getElementById('diag');
let ready = false, bgmOn = false, song = 1;

// --- audio ----------------------------------------------------------------
// The music is synthesised inside the wasm module and pulled out here:
// sd_audio() fills two float buffers, which get copied into short
// AudioBuffers and scheduled back to back.  Only standard nodes are used - no
// ScriptProcessorNode and no AudioWorklet.
const MUS_CHUNK = 4096;
const MUS_AHEAD = 0.4;
const MUS_TICK = 60;

let actx = null, musGain = null, musNext = 0, musBlocks = 0, musTimer = 0;

function ensureContext() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  if (!actx) actx = new AC();
  if (actx.state === 'suspended') actx.resume();
  ensurePump();
}

function ensurePump() {
  if (!actx || !ready || musTimer) return;
  musGain = actx.createGain();
  musGain.gain.value = 1;
  musGain.connect(actx.destination);
  Module._sd_audio_init(actx.sampleRate);
  musNext = 0;
  musTimer = setInterval(musPump, MUS_TICK);
  musPump();
}

function musPump() {
  if (!actx || actx.state !== 'running') return;
  const rate = actx.sampleRate;
  const pl = Module._sd_audio_left() >> 2;
  const pr = Module._sd_audio_right() >> 2;

  if (musNext < actx.currentTime) musNext = actx.currentTime + 0.05;
  while (musNext < actx.currentTime + MUS_AHEAD) {
    const buf = actx.createBuffer(2, MUS_CHUNK, rate);
    const src = actx.createBufferSource();
    Module._sd_audio(MUS_CHUNK);
    buf.getChannelData(0).set(Module.HEAPF32.subarray(pl, pl + MUS_CHUNK));
    buf.getChannelData(1).set(Module.HEAPF32.subarray(pr, pr + MUS_CHUNK));
    src.buffer = buf;
    src.connect(musGain);
    src.start(musNext);
    musNext += MUS_CHUNK / rate;
    musBlocks++;
  }
}

var Module = {
  onRuntimeInitialized() {
    if (Module._sd_init() !== 0) {
      statusEl.textContent = 'depth.dar を読めませんでした';
      return;
    }
    ready = true;
    ensurePump();
    const w = Module._sd_width(), h = Module._sd_height();
    const img = ctx2d.createImageData(w, h);
    statusEl.textContent = 'パターン ' + Module._sd_patterns() +
      ' 枚 / F4 で BGM（クリックかキーで音を許可）';

    // 33ms, the tick WinMain arms: FUN_00424870(this, 0x21, 200, 0).
    setInterval(() => {
      Module._sd_tick();
      const p = Module._sd_framebuffer();
      img.data.set(Module.HEAPU8.subarray(p, p + w * h * 4));
      ctx2d.putImageData(img, 0, 0);
    }, 33);

    setInterval(() => {
      diagEl.textContent = actx
        ? `audio ${actx.state} ${actx.sampleRate}Hz  blocks ${musBlocks}` +
          `  queued ${Math.max(0, musNext - actx.currentTime).toFixed(2)}s` +
          `  bgm${String(song).padStart(2, '0')}.mid`
        : 'audio: 未開始（クリックか何かキーを押してください）';
    }, 500);
  }
};

addEventListener('keydown', e => {
  ensureContext();
  if (!ready) return;
  if (e.code === 'Digit1') { Module._sd_set_scene(0); e.preventDefault(); return; }
  if (e.code === 'Digit2') { Module._sd_set_scene(1); e.preventDefault(); return; }
  if (e.code === 'F4') {
    bgmOn = !bgmOn;
    Module._sd_set_bgm(bgmOn ? 1 : 0);
    statusEl.textContent = 'BGM ' + (bgmOn ? 'ON' : 'OFF');
    e.preventDefault();
    return;
  }
  if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') {
    song += e.code === 'ArrowRight' ? 1 : -1;
    if (song < 1) song = 15;
    if (song > 15) song = 1;
    Module._sd_set_song(song);
    statusEl.textContent = 'bgm' + String(song).padStart(2, '0') + '.mid';
    e.preventDefault();
  }
});
cv.addEventListener('mousedown', ensureContext);
addEventListener('pointerdown', ensureContext);
</script>
<script src="superdepth.js"></script>
</body>
</html>
